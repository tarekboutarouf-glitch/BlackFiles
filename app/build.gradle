plugins { id 'com.android.application' }
android {
    namespace 'com.dossiersnoirs.app'
    compileSdk 36
    defaultConfig {
        applicationId "com.dossiersnoirs.app"
        minSdk 23
        targetSdk 36
        versionCode 3
        versionName "1.2"
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.6.0'      // AdMob
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0' // consentement RGPD
    implementation 'com.android.billingclient:billing:8.0.0'              // achat « Supprimer les pubs »
}
